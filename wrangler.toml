name = "lajiao-gongfang"
pages_build_output_dir = "dist"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# R2 bucket for cloud data storage (user data shared across all users)
[[r2_buckets]]
binding = "DB"
bucket_name = "lajiao-db"

# R2 bucket for image uploads
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "lajiao-images"

[observability]
enabled = true
